name: pingcheck

services:
  ss-client:
    image: ghcr.io/shadowsocks/sslocal-rust:v1.25.0
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/bin/sh", "/usr/local/bin/watch-config.sh"]
    environment:
      SS_CONFIG_PATH: /pingcheck-data/ss-client/config.json
      SS_POLL_INTERVAL: "2"
    volumes:
      - pingcheck_data:/pingcheck-data:ro
      - ./ss-client/watch-config.sh:/usr/local/bin/watch-config.sh:ro
    expose:
      - "1080"
    healthcheck:
      test: ["CMD-SHELL", "[ ! -s /pingcheck-data/ss-client/config.json ] || nc -z 127.0.0.1 1080"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    cap_add:
      - NET_RAW
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/pingcheck.db
      SHADOWSOCKS_CONFIG_PATH: /app/data/ss-client/config.json
      SHADOWSOCKS_SOCKS_HOST: ss-client
      SHADOWSOCKS_SOCKS_PORT: 1080
    depends_on:
      ss-client:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - pingcheck_data:/app/data
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  pingcheck_data:
